<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5e2840" />
  <title>Lilly Lux Lashes | Offline</title>
  <style>
    :root {
      --ink: #221c1f;
      --plum: #5e2840;
      --rose: #a94467;
      --cream: #fffdf8;
      --line: rgba(94, 40, 64, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--cream);
      color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(440px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      box-shadow: 0 22px 50px rgba(94, 40, 64, 0.1);
    }

    h1 {
      margin: 0 0 12px;
      color: var(--plum);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 22px;
      color: #5d4e53;
      line-height: 1.6;
    }

    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 8px;
      background: var(--rose);
      color: white;
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>
      Lilly Lux Lashes needs an internet connection to load booking times and secure card details.
      Please reconnect, then try again.
    </p>
    <a href="/">Try Again</a>
  </main>
</body>
</html>
